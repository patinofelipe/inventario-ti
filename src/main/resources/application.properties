spring.application.name=inventario-ti
# Configure DB_URL, DB_USERNAME e DB_PASSWORD no ambiente local. Não versionar senhas reais.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventario_ti?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:inventario_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.error.include-message=never
server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
