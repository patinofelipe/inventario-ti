
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo usuário - Inventário TI</title>

    <link rel="stylesheet" th:href="@{/css/usuario-formulario.css}">
</head>

<body>
<main class="container">

    <section class="painel">

        <h1>Novo usuário</h1>

        <p class="subtitulo">
            Preencha os dados para criar uma nova conta no Inventário TI.
        </p>

        <div class="erro"
             th:if="${erro}"
             th:text="${erro}">
        </div>

        <form th:action="@{/usuarios/novo}" method="post">

            <label for="nome">Nome completo</label>
            <input type="text"
                   id="nome"
                   name="nome"
                   maxlength="150"
                   autocomplete="name"
                   required>

            <label for="email">E-mail</label>
            <input type="email"
                   id="email"
                   name="email"
                   maxlength="254"
                   autocomplete="email"
                   required>

            <label for="senha">Senha</label>
            <input type="password"
                   id="senha"
                   name="senha"
                   minlength="12"
                   maxlength="72"
                   autocomplete="new-password"
                   required>

            <p class="ajuda">
                Utilize uma senha com pelo menos 12 caracteres.
            </p>

            <label for="perfil">Perfil de acesso</label>

            <select id="perfil" name="perfil" required>
                <option value="">Selecione um perfil</option>
                <option value="USUARIO">Usuário</option>
                <option value="CLIENTE">Cliente</option>
            </select>

            <div class="botoes">

                <button type="submit">
                    Cadastrar usuário
                </button>

                <a class="voltar" th:href="@{/usuarios}">
                    Cancelar
                </a>

            </div>

        </form>

    </section>

</main>
</body>
</html>
