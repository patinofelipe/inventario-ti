
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários - Inventário TI</title>

    <link rel="stylesheet" th:href="@{/css/usuarios.css}">
</head>

<body>
<main class="container">

    <header class="cabecalho">
        <div>
            <h1>Usuários do sistema</h1>

            <p class="subtitulo">
                Consulta das contas e dos respectivos perfis de acesso.
            </p>
        </div>

        <div class="botoes-cabecalho">
            <a class="botao" th:href="@{/usuarios/novo}">
                + Novo usuário
            </a>

            <a class="botao" th:href="@{/}">
                Voltar ao painel
            </a>
        </div>
    </header>

    <section class="painel">

        <div th:if="${sucesso}"
             class="mensagem mensagem-sucesso"
             th:text="${sucesso}">
        </div>

        <div th:if="${erro}"
             class="mensagem mensagem-erro"
             th:text="${erro}">
        </div>

        <table th:if="${not #lists.isEmpty(usuarios)}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Perfil</th>
                <th>Situação</th>
                <th>E-mail verificado</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.id}">1</td>

                <td th:text="${usuario.nome}">Nome</td>

                <td th:text="${usuario.email}">
                    email@exemplo.com
                </td>

                <td>
                    <span th:each="perfil, iteracao : ${usuario.perfis}">
                        <span th:text="${perfil.nome}">USUARIO</span><span
                            th:if="${not iteracao.last}">, </span>
                    </span>
                </td>

                <td>
                    <span class="situacao"
                          th:classappend="${usuario.ativo} ? ' ativo' : ' inativo'"
                          th:text="${usuario.ativo} ? 'Ativo' : 'Inativo'">
                        Ativo
                    </span>
                </td>

                <td th:text="${usuario.emailVerificado} ? 'Sim' : 'Não'">
                    Sim
                </td>
            </tr>
            </tbody>
        </table>

        <p class="vazio" th:if="${#lists.isEmpty(usuarios)}">
            Nenhum usuário cadastrado.
        </p>

    </section>
</main>
</body>
</html>
