
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo equipamento | Inventário TI</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #123b70;
            color: white;
            padding: 22px;
        }

        main {
            max-width: 900px;
            margin: 28px auto;
            padding: 0 16px;
        }

        form {
            background: white;
            padding: 24px;
            border-radius: 12px;
        }

        .campos {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        .acoes {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button, .voltar {
            padding: 11px 16px;
            border: 0;
            border-radius: 6px;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
        }

        button {
            background: #2563eb;
            color: white;
        }

        .voltar {
            background: #e2e8f0;
            color: #1e293b;
        }

        .erro {
            color: #b91c1c;
            background: #fee2e2;
            padding: 12px;
            border-radius: 6px;
        }

        @media (max-width: 600px) {
            .campos { grid-template-columns: 1fr; }
            form { padding: 16px; }
        }
    </style>
</head>
<body>
<header>
    <h1>Inventário TI</h1>
    <p>Cadastro de equipamento</p>
</header>

<main>
   <form th:action="${modoEdicao}
        ? @{/equipamentos/{id}/atualizar(id=${idEdicao})}
        : @{/equipamentos/salvar}"
      th:object="${equipamento}"
      method="post">
        <h2 th:text="${modoEdicao} ? 'Editar equipamento' : 'Novo equipamento'">
    Novo equipamento
</h2>

        <p class="erro" th:if="${erro}" th:text="${erro}"></p>

        <div class="campos">
            <div>
                <label for="numero">Número *</label>
                <input id="numero" type="text" th:field="*{numero}"
                       maxlength="50" required>
            </div>

            <div>
                <label for="nrp">NRP</label>
                <input id="nrp" type="text" th:field="*{nrp}"
                       maxlength="80">
            </div>

            <div>
                <label for="localidade">Localidade *</label>
                <input id="localidade" type="text"
                       th:field="*{localidade}"
                       maxlength="150" required>
            </div>

            <div>
                <label for="macAddress">Endereço MAC</label>
                <input id="macAddress" type="text"
                       th:field="*{macAddress}"
                       maxlength="17"
                       placeholder="AA:BB:CC:DD:EE:FF">
            </div>

            <div>
                <label for="ip">Endereço IP</label>
                <input id="ip" type="text" th:field="*{ip}"
                       maxlength="45" placeholder="10.20.0.15">
            </div>

            <div>
                <label for="servidor">Servidor</label>
                <input id="servidor" type="text"
                       th:field="*{servidor}" maxlength="150">
            </div>

            <div>
                <label for="numeroSwitch">Número do switch</label>
                <input id="numeroSwitch" type="text"
                       th:field="*{numeroSwitch}" maxlength="50">
            </div>

            <div>
                <label for="portaSwitch">Porta do switch</label>
                <input id="portaSwitch" type="text"
                       th:field="*{portaSwitch}" maxlength="30">
            </div>

            <div>
                <label for="status">Status</label>
                <select id="status" th:field="*{status}">
                    <option value="ATIVO">Ativo</option>
                    <option value="INATIVO">Inativo</option>
                    <option value="MANUTENCAO">Em manutenção</option>
                </select>
            </div>
        </div>

        <div class="acoes">
            <button type="submit"
        th:text="${modoEdicao} ? 'Salvar alterações' : 'Salvar equipamento'">
    Salvar equipamento
</button>
            <a class="voltar" th:href="@{/equipamentos}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
