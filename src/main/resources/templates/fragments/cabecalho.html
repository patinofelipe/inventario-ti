
<header th:fragment="cabecalho"
        xmlns:th="http://www.thymeleaf.org"
        class="barra-sistema">

    <div class="barra-marca">
        Inventário TI
    </div>

    <div class="barra-identificacao"
         th:if="${usuarioLogado != null}">

        <div class="barra-usuario">
            <strong th:text="${usuarioLogado.nome}">
                Nome do usuário
            </strong>

            <small th:text="${usuarioLogado.perfil}">
                Perfil
            </small>

            <small th:text="${usuarioLogado.email}">
                email
            </small>
        </div>

        <div class="barra-acoes">

            <a class="barra-botao"
               th:href="@{/}">
                Painel
            </a>

            <a class="barra-botao"
               th:if="${usuarioLogado.administrador}"
               th:href="@{/usuarios}">
                Gerenciar usuários
            </a>

            <form th:action="@{/logout}"
                  method="post"
                  style="margin: 0;">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <button type="submit"
                        class="barra-botao barra-sair">
                    Sair
                </button>
            </form>

        </div>
    </div>

</header>
