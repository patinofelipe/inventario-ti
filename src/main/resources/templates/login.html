
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Inventário TI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f1f5f9;
            font-family: Arial, Helvetica, sans-serif;
            color: #1e293b;
        }

        .painel {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.10);
        }

        h1 {
            margin: 0 0 8px;
            color: #1d4ed8;
            font-size: 26px;
            text-align: center;
        }

        .descricao {
            margin: 0 0 28px;
            color: #64748b;
            text-align: center;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 7px;
            background: #1d4ed8;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        .mensagem {
            margin-top: 18px;
            padding: 12px;
            border-radius: 7px;
            font-size: 14px;
        }

        .erro {
            background: #fee2e2;
            color: #991b1b;
        }

        .logout {
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>

<body>
    <main class="painel">
        <h1>Inventário TI</h1>
        <p class="descricao">Acesse sua conta para continuar</p>

        <form th:action="@{/login}" method="post">
            <input type="hidden"
       th:name="${_csrf.parameterName}"
       th:value="${_csrf.token}" />
            <label for="username">E-mail</label>
            <input
                type="email"
                id="username"
                name="username"
                autocomplete="username"
                required
                autofocus>

            <label for="password">Senha</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required>

            <button type="submit">Entrar</button>
        </form>

        <div th:if="${param.error}" class="mensagem erro"
             role="alert">
            Não foi possível entrar. Confira suas credenciais.
        </div>

        <div th:if="${param.logout}" class="mensagem logout">
            Você saiu do sistema com sucesso.
        </div>
    </main>
</body>
</html>
