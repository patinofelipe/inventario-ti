
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Inventário TI</title>

    <link rel="stylesheet" th:href="@{/css/login.css}">
    <script th:src="@{/js/login.js}" defer></script>
</head>

<body>
    <main class="painel">
        <h1>Inventário TI</h1>
        <p class="descricao">Acesse sua conta para continuar</p>

        <form th:action="@{/login}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <label for="username">E-mail</label>
            <input
                type="email"
                id="username"
                name="username"
                autocomplete="username"
                required
                autofocus>

            <label for="password">Senha</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required>

            <button type="submit">Entrar</button>
        </form>

        <div th:if="${param.error}" class="mensagem erro"
             role="alert">
            Não foi possível entrar. Confira suas credenciais.
        </div>

        <div th:if="${param.logout}" class="mensagem logout">
            Você saiu do sistema com sucesso.
        </div>
    </main>
</body>
</html>
